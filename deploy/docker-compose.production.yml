name: preinscripciones-flacsouy

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatorio}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatorio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatorio}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # El apagado ordenado espera hasta 110 s a los envíos en curso (ver docs/operacion-envios.md).
    stop_grace_period: 120s
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL es obligatorio}
      WORDPRESS_URL: ${WORDPRESS_URL:?WORDPRESS_URL es obligatorio}
      # Debe coincidir con FLACSO_PREINSCRIPCIONES_CATALOG_TOKEN de wp-config.php; sin él WordPress
      # entrega el catálogo sin los correos de notificación de cada oferta.
      WORDPRESS_CATALOG_TOKEN: ${WORDPRESS_CATALOG_TOKEN:?WORDPRESS_CATALOG_TOKEN es obligatorio}
      META_PIXEL_ID: ${META_PIXEL_ID:-}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
      GA4_API_SECRET: ${GA4_API_SECRET:-}
      GOOGLE_OIDC_CLIENT_ID: ${GOOGLE_OIDC_CLIENT_ID:-}
      GOOGLE_OIDC_CLIENT_SECRET: ${GOOGLE_OIDC_CLIENT_SECRET:-}
      GOOGLE_OIDC_REDIRECT_URI: ${GOOGLE_OIDC_REDIRECT_URI:-}
      GOOGLE_SERVICE_ACCOUNT_SUBJECT: ${GOOGLE_SERVICE_ACCOUNT_SUBJECT:-}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:?ADMIN_ALLOWED_EMAILS es obligatorio}
      APP_SETTINGS_ENCRYPTION_KEY: ${APP_SETTINGS_ENCRYPTION_KEY:?APP_SETTINGS_ENCRYPTION_KEY es obligatorio}
      UPLOAD_TMP_DIR: /tmp/flacso-preinscripciones
      # Barrido de envíos abandonados y reconciliación de Sheets cada 60 s.
      SUBMISSION_SWEEPER_ENABLED: ${SUBMISSION_SWEEPER_ENABLED:-false}
      # Proxies delante de la API (Apache del servidor → nginx del contenedor web). Con esto el límite de
      # frecuencia distingue a cada visitante; sin él todos compartirían la IP del proxy.
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
    volumes:
      - ${SECRETS_DIR:?SECRETS_DIR es obligatorio}:/app/.secrets:ro
      - upload_tmp:/tmp/flacso-preinscripciones
    expose:
      - "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_PORT:?WEB_PORT es obligatorio}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  upload_tmp:
