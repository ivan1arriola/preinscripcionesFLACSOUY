services:
  postgres:
    image: postgres:16-alpine
    container_name: preinscripciones-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flacso_preinscripciones
      POSTGRES_USER: flacso
      POSTGRES_PASSWORD: flacso_password
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flacso -d flacso_preinscripciones"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: preinscripciones-api
    restart: unless-stopped
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgres://flacso:flacso_password@postgres:5432/flacso_preinscripciones
      WORDPRESS_URL: ${WORDPRESS_URL:-}
      WORDPRESS_CATALOG_TOKEN: ${WORDPRESS_CATALOG_TOKEN:-}
      ADMIN_ALLOWED_EMAILS: ${ADMIN_ALLOWED_EMAILS:-web@flacso.edu.uy}
      APP_SETTINGS_ENCRYPTION_KEY: ${APP_SETTINGS_ENCRYPTION_KEY:-}
      UPLOAD_TMP_DIR: /tmp/flacso-preinscripciones
    volumes:
      - ./.secrets:/app/.secrets:ro
      - upload_tmp:/tmp/flacso-preinscripciones
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: preinscripciones-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy

  notification-worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: preinscripciones-notification-worker
    restart: unless-stopped
    command: ["node", "apps/api/dist/worker-notifications.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://flacso:flacso_password@postgres:5432/flacso_preinscripciones
      APP_SETTINGS_ENCRYPTION_KEY: ${APP_SETTINGS_ENCRYPTION_KEY:-}
      UPLOAD_TMP_DIR: /tmp/flacso-preinscripciones
    volumes:
      - ./.secrets:/app/.secrets:ro
      - upload_tmp:/tmp/flacso-preinscripciones
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  upload_tmp:
