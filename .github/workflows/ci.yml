name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test and Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flacso_preinscripciones
          POSTGRES_USER: flacso
          POSTGRES_PASSWORD: flacso_password
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit & integration tests
        env:
          DATABASE_URL: postgres://flacso:flacso_password@localhost:5433/flacso_preinscripciones
          POSTGRES_PORT: 5433
        run: pnpm test

      - name: Build contracts and apps
        run: |
          pnpm --filter @flacso/contracts build
          pnpm --filter api build
          pnpm --filter web build

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Docker Compose & E2E tests
        env:
          DATABASE_URL: postgres://flacso:flacso_password@postgres:5432/flacso_preinscripciones
        run: |
          docker compose up -d --build
          # Wait for web service
          npx wait-on http://localhost:5173
          pnpm e2e
          docker compose down -v
